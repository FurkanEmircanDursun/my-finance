<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
         other than 0. Without it the app draws under the Android 15 status bar
         and the gesture pill with no way to know they are there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Kredi kartı ekstrelerini tarayıcıda analiz eden kişisel finans aracı. Ekstre dosyaları cihazdan çıkmaz; istersen bir hesapla veriler cihazlar arasında eşitlenir."
    />
    <title>My Finance — Ekstre Analizi</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' x='4' font-size='26' font-family='system-ui'%3E%E2%82%BA%3C/text%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
