name: iOS PDF share compile

on:
  push:
    branches: [codex/mizan-ios-share-verification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-share-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-compile:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the isolated source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate the independent probe project contract
        run: |
          PROBE_PROJECT="$(node ci/ios-share/generate-probe-project.mjs "$RUNNER_TEMP/MizanShareProbe-Contract")"
          xcodebuild -list -project "$PROBE_PROJECT"
      - name: Build the web application
        run: npm run build
      - name: Synchronize the native iOS project
        run: npm run ios:sync
      - name: Validate native share target wiring
        run: npm run ios:validate
      - name: Test cross-process inbox clearing
        run: |
          swiftc ios/App/Shared/SharedPdfGeneration.swift scripts/test-shared-pdf-generation.swift -o "$RUNNER_TEMP/mizan-share-generation-tests"
          "$RUNNER_TEMP/mizan-share-generation-tests"
      - name: Compile App and embedded share extension
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Prove the actual iOS Share Sheet route
        run: node ci/ios-share/run-share-proof.mjs
      - name: Retain synthetic simulator proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mizan-ios-share-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/MizanShareProofEvidence
          if-no-files-found: warn
          retention-days: 7
