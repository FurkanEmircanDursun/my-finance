name: iOS PDF share compile

on:
  push:
    branches: [codex/mizan-ios-share-verification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-share-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-compile:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the isolated source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build the web application
        run: npm run build
      - name: Synchronize the native iOS project
        run: npm run ios:sync
      - name: Validate native share target wiring
        run: npm run ios:validate
      - name: Compile App and embedded share extension
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
